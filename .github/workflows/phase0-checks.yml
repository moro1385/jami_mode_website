name: Phase 0 checks
on:
  pull_request:
  push:
    branches: [main, security/first-containment, feature/**]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: phase0-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  local-security-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, verified against official API
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5, verified against official API
        with:
          node-version: 24
          cache: npm
      - name: Frozen dependency installation without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Audit all locked dependencies, including build tools
        run: npm audit --package-lock-only
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - name: Build without live sitemap/catalog access
        run: npm run build:isolated
      - name: Enforce initial JavaScript, stylesheet and font budgets
        run: npm run check:build
      - name: Check bounded static capacity on disposable loopback server
        run: node scripts/check-static-capacity.mjs
      - name: Install PostgreSQL tools for disposable local clusters
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql postgresql-client libpq-dev
          pg_bin="$(pg_config --bindir)"
          test -x "$pg_bin/initdb"
          echo "JAMI_TEST_PG_BIN=$pg_bin" >> "$GITHUB_ENV"
      - name: Install isolated browser test runtime
        run: npx playwright install --with-deps chromium
      - name: Browser checkout and account flows with intercepted synthetic APIs
        run: npm run test:e2e:offline
      - run: npm run test:phase0:db
      - run: npm run test:bootstrap:db
      - name: Confirm image-array predicates in a disposable local database
        run: npm run test:admin:images:db
